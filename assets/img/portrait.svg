<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" width="440" height="540" role="img" aria-label="Rahbar Homidova">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#274a72"/>
      <stop offset="0.55" stop-color="#1E3A5C"/>
      <stop offset="1" stop-color="#13273E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#C2A15A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C2A15A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="440" height="540" fill="url(#bg)"/>
  <rect width="440" height="540" fill="url(#glow)"/>

  <!-- inset hairline frame -->
  <rect x="22" y="22" width="396" height="496" fill="none" stroke="#C2A15A" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- faint large drop watermark -->
  <g opacity="0.10" fill="none" stroke="#FCFAF4" stroke-width="2">
    <path d="M330 250c0 38-30 64-58 110-28-46-58-72-58-110a58 58 0 0 1 116 0Z"/>
  </g>

  <!-- centred brand medallion -->
  <g transform="translate(220 250)">
    <circle r="92" fill="none" stroke="#C2A15A" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle r="78" fill="#0f2034" fill-opacity="0.35" stroke="#C2A15A" stroke-width="2"/>
    <g fill="none" stroke="#C2A15A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 -8)">
      <path d="M0 -44C0 -44 30 -8 30 16a30 30 0 0 1-60 0C-30 -8 0 -44 0 -44Z"/>
      <path d="M-15 16a15 15 0 0 0 10 17"/>
      <path d="M-30 40c5-4.6 10-4.6 15 0s10 4.6 15 0 10-4.6 15 0"/>
    </g>
  </g>

  <!-- monogram dots -->
  <g fill="#C2A15A">
    <circle cx="220" cy="372" r="3"/>
    <circle cx="206" cy="372" r="2" fill-opacity="0.6"/>
    <circle cx="234" cy="372" r="2" fill-opacity="0.6"/>
  </g>
</svg>
